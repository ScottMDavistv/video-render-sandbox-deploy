# Manual GitHub-only gate proof. No secrets, cloud access, or deployment.
name: Storage sandbox approval gate proof
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  approval-marker:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository_id == '1473464013' &&
          github.ref == 'refs/heads/main' &&
          github.actor_id == '361667965' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    environment:
      name: video-render-media-sandbox
    steps:
      - name: Emit fixed marker after approval
        shell: bash
        run: |
          set -euo pipefail
          [[ ${GITHUB_EVENT_NAME:-} == workflow_dispatch ]]
          [[ ${GITHUB_REPOSITORY_ID:-} == 1473464013 ]]
          [[ ${GITHUB_REF:-} == refs/heads/main ]]
          [[ ${GITHUB_ACTOR_ID:-} == 361667965 ]]
          [[ ${GITHUB_RUN_ATTEMPT:-} == 1 ]]
          printf '%s\n' 'STORAGE_GATE_APPROVAL_MARKER_V1'
