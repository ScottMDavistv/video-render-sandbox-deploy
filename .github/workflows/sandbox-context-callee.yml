name: Inert sandbox reusable caller-context specimen
on:
  workflow_call:
permissions: {}
jobs:
  inspect_context:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.repository_id == '1473464013' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Emit fixed caller-context result only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """Draft own-run context check. Emits only a fixed pass/refusal marker."""
          import json
          import os
          import re
          import urllib.request
          
          REPO = "ScottMDavistv/video-render-sandbox-deploy"
          CALLER_PATH = ".github/workflows/sandbox-context-caller.yml"
          CALLER_REF = REPO + "/" + CALLER_PATH + "@refs/heads/main"
          SAFE_INPUT = "caller-context-v1"
          LIMIT = 1048576
          
          
          class Refused(Exception):
              pass
          
          
          def require(value):
              if not value:
                  raise Refused()
          
          
          def unique_object(pairs):
              obj = {}
              for key, value in pairs:
                  require(key not in obj)
                  obj[key] = value
              return obj
          
          
          def parse_json(raw):
              require(isinstance(raw, bytes) and len(raw) <= LIMIT)
              value = json.loads(raw, object_pairs_hook=unique_object)
              require(type(value) is dict)
              return value
          
          
          def validate_context(env, event):
              require(env.get("GITHUB_REPOSITORY") == REPO)
              require(env.get("GITHUB_WORKFLOW_REF") == CALLER_REF)
              require(env.get("GITHUB_REF") == "refs/heads/main")
              require(env.get("GITHUB_EVENT_NAME") == "workflow_dispatch")
              require(env.get("GITHUB_RUN_ATTEMPT") == "1")
              require(env.get("GITHUB_API_URL") == "https://api.github.com")
              run_id = env.get("GITHUB_RUN_ID", "")
              sha = env.get("GITHUB_SHA", "")
              require(re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is not None)
              require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None and sha != "0" * 40)
              require(type(event) is dict)
              # Read the original dispatch payload, never workflow_call inputs or `with`.
              require(event.get("inputs") == {"proof_tag": SAFE_INPUT})
              require(event.get("ref") == "refs/heads/main")
              repository = event.get("repository")
              require(type(repository) is dict and repository.get("full_name") == REPO)
              return run_id, sha
          
          
          def read_event(env):
              with open(env["GITHUB_EVENT_PATH"], "rb") as source:
                  return parse_json(source.read(LIMIT + 1))
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise Refused()
          
          
          def fetch_run(run_id, token):
              require(re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is not None)
              require(isinstance(token, str) and token and "\n" not in token and "\r" not in token)
              url = "https://api.github.com/repos/" + REPO + "/actions/runs/" + run_id
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }, method="GET")
              # One own-run request. No redirect, retry, alternate endpoint or cloud call.
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              with opener.open(request, timeout=15) as response:
                  require(response.status == 200 and response.geturl() == url)
                  return parse_json(response.read(LIMIT + 1))
          
          
          def validate_run(run, run_id, sha):
              require(type(run) is dict)
              require(type(run.get("id")) is int and str(run["id"]) == run_id)
              require(type(run.get("run_attempt")) is int and run["run_attempt"] == 1)
              require(run.get("path") == CALLER_PATH)
              require(run.get("event") == "workflow_dispatch")
              require(run.get("head_branch") == "main" and run.get("head_sha") == sha)
              for key in ("repository", "head_repository"):
                  repository = run.get(key)
                  require(type(repository) is dict and repository.get("full_name") == REPO)
          
          
          def main(env=None, event_reader=None, run_reader=None):
              env = os.environ if env is None else env
              event_reader = read_event if event_reader is None else event_reader
              run_reader = fetch_run if run_reader is None else run_reader
              try:
                  run_id, sha = validate_context(env, event_reader(env))
                  run = run_reader(run_id, env.get("GH_TOKEN", ""))
                  validate_run(run, run_id, sha)
              except Exception:
                  print("CONTEXT_PROOF_REFUSED")
                  return 1
              print("CONTEXT_PROOF_PASS")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
